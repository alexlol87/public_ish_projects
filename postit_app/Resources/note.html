<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base id="base" href="">
<style>
  html, body { margin: 0; min-height: 100%; }
  body { padding: 26px 12px 12px; font: 14px/1.45 -apple-system, sans-serif; -webkit-user-select: none; user-select: none; word-wrap: break-word; }
  h1, h2, h3, h4 { margin: .6em 0 .3em; line-height: 1.2; }
  h1 { font-size: 1.5em; } h2 { font-size: 1.3em; } h3 { font-size: 1.1em; }
  p, ul, ol, blockquote, pre, table { margin: .4em 0; }
  ul, ol { padding-left: 1.5em; }
  li.task-list-item, li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.2em; }
  input[type=checkbox] { margin-right: .4em; }
  a { color: inherit; text-decoration: underline; }
  img { max-width: 100%; }
  code, pre { font: 12px ui-monospace, Menlo, monospace; background: rgba(128,128,128,.2); border-radius: 4px; }
  code { padding: 1px 4px; }
  pre { padding: 8px; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  blockquote { margin-left: 0; padding-left: 10px; border-left: 3px solid rgba(128,128,128,.5); opacity: .85; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid rgba(128,128,128,.5); padding: 3px 8px; }
  hr { border: 0; border-top: 1px solid rgba(128,128,128,.5); }
</style>
<script src="marked.min.js"></script>
</head>
<body>
<script>
  const post = m => window.webkit.messageHandlers.note.postMessage(m);
  const interactive = e => !!e.target.closest('a, input');

  function render(md, bg, fg) {
    const y = window.scrollY;
    document.documentElement.style.background = bg;
    document.body.style.cssText = 'background:' + bg + ';color:' + fg;
    document.body.innerHTML = marked.parse(md, { gfm: true });
    document.querySelectorAll('input[type=checkbox]').forEach((box, i) => {
      box.disabled = false;
      box.addEventListener('click', () => post({ t: 'task', i }));
    });
    window.scrollTo(0, y);
  }

  // Swift decides whether a drag moves the window, so it needs to know what was pressed.
  document.addEventListener('mousedown', e => post({ t: 'down', interactive: interactive(e) }));
  document.addEventListener('dblclick', e => { if (!interactive(e)) post({ t: 'edit' }); });
</script>
</body>
</html>
