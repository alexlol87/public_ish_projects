name: agents

# agents/: ReviewAgent's and TesterAgent's custom agents have a name and a description, use only known tools that
# can't edit files (except creating them), and have valid handoffs.
on:
  pull_request:
    paths:
      - 'agents/**'
      - '.github/workflows/agents.yml'
  push:
    paths:
      - 'agents/**'
      - '.github/workflows/agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-agent:
    name: ReviewAgent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agents/ReviewAgent
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/check_agents.py

  tester-agent:
    name: TesterAgent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml
      - run: python3 agents/ReviewAgent/scripts/check_agents.py agents/TesterAgent/.github/agents

