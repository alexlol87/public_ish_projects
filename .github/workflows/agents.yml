name: agents

# agents/: ReviewAgent's custom agent has a name and a description, uses only known, read-only tools, and has valid
# handoffs.
on:
  pull_request:
    paths:
      - 'agents/**'
      - '.github/workflows/agents.yml'
  push:
    paths:
      - 'agents/**'
      - '.github/workflows/agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-agent:
    name: ReviewAgent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agents/ReviewAgent
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/check_agents.py

