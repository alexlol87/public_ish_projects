name: constellation

# Constellation, the macOS notes app in constellation/: tests (warnings are errors), the .app bundle and a launch test
# against a fixture Vault. Runs only when this project changes.
on:
  pull_request:
    paths:
      - 'constellation/**'
      - '.github/workflows/constellation.yml'
  push:
    paths:
      - 'constellation/**'
      - '.github/workflows/constellation.yml'
  workflow_dispatch:

concurrency:
  group: constellation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: constellation

jobs:
  build:
    name: build, test, launch
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version

      - name: Unit tests (warnings are errors)
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build the app bundle
        run: scripts/build-app.sh

      - name: Launch test
        # Opens the fixture Vault and checks the app stays up.
        run: |
          app="build/Constellation.app"
          CONSTELLATION_VAULT="$PWD/fixtures/vault" "$app/Contents/MacOS/Constellation" > "$RUNNER_TEMP/launch.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            echo "::error::The app quit or crashed at launch"
            cat "$RUNNER_TEMP/launch.log"
            exit 1
          fi
          kill "$pid"
          cat "$RUNNER_TEMP/launch.log"

      - name: Zip the app
        run: ditto -c -k --keepParent build/Constellation.app build/Constellation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: constellation-app
          path: constellation/build/Constellation.zip
          if-no-files-found: error

  release:
    # Every green build of main replaces the "constellation-latest" release.
    name: publish the latest build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: constellation-app
      - name: Replace the constellation-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md << EOF
          The latest Constellation build from \`main\` (commit ${GITHUB_SHA::7}), built and tested on macOS 15.

          **Install:** unzip \`Constellation.zip\`, move \`Constellation.app\` to /Applications, then run
          \`xattr -dr com.apple.quarantine /Applications/Constellation.app\` once (the app is ad-hoc signed).
          EOF
          gh release delete constellation-latest --cleanup-tag --yes || true
          gh release create constellation-latest Constellation.zip --target "$GITHUB_SHA" --latest \
            --title "Constellation (latest build)" --notes-file notes.md
