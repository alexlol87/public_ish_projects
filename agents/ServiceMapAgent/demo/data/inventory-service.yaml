services:
  - id: inventory-service
    layer: Domain
    purpose: Knows how much of each product is in stock and holds reservations for open orders.
    page: services/inventory-service/index.html
    endpoints:
      - {method: GET, path: "/stock/{sku}", use_when: "Showing availability on a product page"}
      - {method: POST, path: /stock/reservations, use_when: "Holding stock for an order being placed; expires after 15 minutes unless confirmed"}
      - {method: DELETE, path: "/stock/reservations/{id}", use_when: "Releasing stock of a cancelled or failed order"}
    calls: []
    produces: []
    consumes: [order-events]
    tables: [stock, reservations]
    database: inventory-db
    deployed: {runtime: ECS Fargate, environments: [dev, test, prod], pipeline: deploy-inventory.yml}
