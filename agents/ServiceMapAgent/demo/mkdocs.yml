site_name: Shop service map (demo)
site_description: A fictional system mapped by the Service Mapper agent, to show what the real map looks like.
docs_dir: docs
use_directory_urls: false  # plain .html links, so pages also open from the built folder
hooks:
  - hooks/graph.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/graph.css
extra_javascript:
  # shortcut: loaded from a CDN, so the graph page needs internet; download the file into docs/javascripts/ for offline use
  - https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js
  - javascripts/graph.js

nav:
  - Start here: index.md
  - System graph: graph.md
  - Journeys:
      - Place an order: journeys/place-order.md
  - All endpoints: endpoints.md
  - Calls and events: calls.md
  - Data: data.md
  - Infrastructure and CI/CD: infrastructure.md
  - Services:
      - api-gateway: services/api-gateway/index.md
      - orders-service:
          - Overview: services/orders-service/index.md
          - POST /orders: services/orders-service/POST-orders.md
          - POST /orders/{id}/cancel: services/orders-service/POST-orders-id-cancel.md
      - billing-service: services/billing-service/index.md
      - inventory-service: services/inventory-service/index.md
      - notification-worker: services/notification-worker/index.md
  - Glossary: glossary.md
  - Map progress: progress.md
