[package]
name = "constellation-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "constellation_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
